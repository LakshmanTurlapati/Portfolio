name: Deploy to Fly

on:
  push:
    branches:
      - nextjs
  workflow_dispatch:

concurrency:
  group: fly-deploy-parzival-live
  cancel-in-progress: true

jobs:
  test:
    name: Test Next.js app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy parzival-live
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -a parzival-live
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
