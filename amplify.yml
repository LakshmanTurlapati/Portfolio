version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --legacy-peer-deps
        # Inject server-side environment variables into .env.production
        # Amplify Console env vars are available at build time but NOT at Lambda runtime
        # Writing them to .env.production bundles them with the server-side code
        - echo "XAI_API_KEY=$XAI_API_KEY" >> .env.production
        - echo "ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY" >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
