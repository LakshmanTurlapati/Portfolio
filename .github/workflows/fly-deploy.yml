name: Deploy to Fly

on:
  push:
    branches:
      - nextjs
  workflow_dispatch:

concurrency:
  group: fly-deploy-parzival-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy parzival-live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -a parzival-live
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
